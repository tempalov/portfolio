<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — страница не найдена · Олег Темпалов</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a192f;
        color: #ccd6f6;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .code {
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #64ffda;
        margin: 0 0 16px;
      }
      h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 12px; color: #e6f1ff; font-weight: 700; }
      p { margin: 0 0 28px; color: #8892b0; font-size: 16px; }
      a {
        display: inline-block;
        padding: 12px 26px;
        border: 1px solid #64ffda;
        border-radius: 6px;
        color: #64ffda;
        text-decoration: none;
        font-size: 14px;
      }
      a:hover { background: rgba(100, 255, 218, 0.1); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Страница не найдена</h1>
      <p>Такой страницы здесь нет. Вернуться на главную?</p>
      <a href="/">tempalov.ru</a>
    </main>
  </body>
</html>
