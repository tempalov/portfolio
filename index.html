<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

    <title>Oleg Tempalov — Solutions Architect</title>
    <meta
      name="description"
      content="12+ years in corporate infrastructure. Solutions Architect: design, automate and integrate AI agents into production. Remote only."
    />

    <link rel="canonical" href="https://tempalov.ru" />
    <link rel="alternate" hreflang="ru" href="https://tempalov.ru" />
    <link rel="alternate" hreflang="en" href="https://tempalov.ru" />
    <link rel="alternate" hreflang="x-default" href="https://tempalov.ru" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
